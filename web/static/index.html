<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerMon</title>
<script src="/static/chart.umd.min.js"></script>
<style>
  :root { --bg:#0e0f12; --card:#16181d; --line:#23262d; --txt:#e6e6e6; --muted:#8a8f98; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--txt); height:100vh; overflow:hidden;
         display:flex; flex-direction:column;
         font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:16px; flex-wrap:wrap;
           padding:12px 18px; border-bottom:1px solid var(--line); background:#121419; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  .spacer { flex:1; }
  .dot { width:9px; height:9px; border-radius:50%; background:#3bbf6b; display:inline-block; }
  .dot.stale { background:#d9534f; }
  .dot.paused { background:#6b7079; }
  .btn { background:#1d2128; color:var(--txt); border:1px solid var(--line); border-radius:7px;
         padding:6px 11px; cursor:pointer; font-size:13px; }
  .btn:hover { background:#252a33; }
  .btn.accent { background:#2a4c7a; border-color:#2a4c7a; color:#fff; }
  /* a disconnected bank: everything below the header dimmed, a note on top */
  main { position:relative; }
  main.paused > :not(.veil) { opacity:.3; }
  .veil { display:none; position:absolute; inset:0; z-index:1; pointer-events:none;
          align-items:center; justify-content:center; flex-direction:column; gap:4px;
          font-size:22px; font-weight:600; }
  .veil small { font-size:13px; font-weight:400; color:var(--muted); }
  main.paused > .veil { display:flex; }
  .age { color:var(--muted); font-size:12px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { background:transparent; color:var(--muted); border:0; padding:6px 11px;
                cursor:pointer; font-size:13px; }
  .seg button:hover { background:#1d2128; color:var(--txt); }
  .seg button.on { background:#2a4c7a; color:#fff; }
  select { background:#1d2128; color:var(--txt); border:1px solid var(--line);
           border-radius:7px; padding:6px 8px; }
  label.ctl { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:6px; }
  main { padding:12px; display:flex; flex-direction:column; gap:12px; flex:1 1 auto; min-height:0; }
  .stats { flex:0 0 auto; display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px;
          min-width:0; overflow:hidden; }
  .stat .k { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .stat .v { font-size:30px; font-weight:600; margin-top:4px; }
  .stat .v small { font-size:15px; color:var(--muted); font-weight:400; }
  .stat .sub { color:var(--muted); font-size:12px; margin-top:6px; }
  .bar { height:6px; border-radius:3px; background:#23262d; margin-top:10px; overflow:hidden; }
  .bar > i { display:block; height:100%; border-radius:3px; }
  .cells-now { flex:0 0 auto; display:grid; grid-template-columns:repeat(auto-fit, minmax(96px,1fr)); gap:12px; }
  .cells-now .cell { background:var(--card); border:1px solid var(--line); border-radius:10px;
                     padding:8px 12px; display:flex; align-items:baseline; justify-content:space-between; min-width:0; }
  .cells-now .cell .ci { color:var(--muted); font-size:12px; }
  .cells-now .cell .cv { font-size:18px; font-weight:600; }
  .cells-now .cell .cv small { font-size:11px; color:var(--muted); font-weight:400; }
  .charts { flex:1 1 auto; min-height:0; display:grid;
            grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); gap:12px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
           display:flex; flex-direction:column; min-height:0; min-width:0; }
  .panel h2 { font-size:13px; font-weight:500; margin:0 0 8px; color:var(--muted); flex:0 0 auto; }
  .panel .wrap { flex:1 1 auto; min-height:0; position:relative; }
  @media (max-width:1100px){
    body { height:auto; overflow:auto; }
    .charts { grid-template-columns:repeat(2,1fr); grid-template-rows:none; }
    .stats { grid-template-columns:repeat(3,1fr); }
    .panel .wrap { min-height:280px; }
  }
  @media (max-width:680px){ .charts{grid-template-columns:1fr;} }
</style>
</head>
<body>
<header>
  <h1>PowerMon</h1>
  <div class="seg" id="banks"></div>
  <span class="dot" id="dot"></span><span class="age" id="age">—</span>
  <span class="age" id="sig" title="Bluetooth signal of the link to this battery"></span>
  <button class="btn" id="link" title="Release the BLE link so the phone app can connect, or take it back">—</button>
  <span class="spacer"></span>
  <label class="ctl">range <select id="range"></select></label>
  <label class="ctl">refresh
    <select id="refresh">
      <option value="0">Off</option>
      <option value="10000">10s</option>
      <option value="30000" selected>30s</option>
      <option value="60000">1m</option>
    </select>
  </label>
</header>

<main>
  <div class="veil">Disconnected<small>BLE link is free for the phone app</small></div>
  <div class="stats">
    <div class="stat"><div class="k">State of charge</div><div class="v" id="s_soc">—</div>
      <div class="bar"><i id="s_soc_bar"></i></div></div>
    <div class="stat"><div class="k">Pack voltage</div><div class="v" id="s_v">—</div></div>
    <div class="stat"><div class="k">Current</div><div class="v" id="s_a">—</div></div>
    <div class="stat"><div class="k">Power</div><div class="v" id="s_w">—</div></div>
    <div class="stat" id="s_eta_card"><div class="k">ETA</div><div class="v" id="s_eta">—</div>
      <div class="sub" id="s_eta_sub"></div></div>
  </div>
  <div class="cells-now" id="cells_now"></div>
  <div class="charts">
    <div class="panel"><h2>Pack voltage</h2><div class="wrap"><canvas id="c_v"></canvas></div></div>
    <div class="panel"><h2>Current (load behaviour)</h2><div class="wrap"><canvas id="c_a"></canvas></div></div>
    <div class="panel"><h2>State of charge</h2><div class="wrap"><canvas id="c_soc"></canvas></div></div>
    <div class="panel"><h2>Temperatures</h2><div class="wrap"><canvas id="c_t"></canvas></div></div>
    <div class="panel"><h2>Cell voltages (min / avg / max)</h2><div class="wrap"><canvas id="c_cells"></canvas></div></div>
    <div class="panel"><h2>Cell balance delta (mV)</h2><div class="wrap"><canvas id="c_d"></canvas></div></div>
  </div>
</main>

<script>
const RANGES = [["30m",30],["1h",60],["3h",180],["6h",360],["12h",720],["24h",1440],["2d",2880],["7d",10080]];
const state = { minutes: 360, refreshMs: 30000, timer: null, bank: "", me: null };

// ---- build range selector
const rangeEl = document.getElementById("range");
RANGES.forEach(([lbl,min]) => rangeEl.add(new Option(lbl, min, false, min === state.minutes)));
rangeEl.onchange = (e) => { state.minutes = +e.target.value; load(); };
document.getElementById("refresh").onchange = (e) => {
  state.refreshMs = +e.target.value; schedule();
};

// ---- colours
const C = { v:"#5b9bd5", a:"#e0883c", soc:"#3bbf6b",
            mos:"#e0883c", t1:"#5b9bd5", t2:"#b06bd9",
            cmin:"#e0883c", cavg:"#3bbf6b", cmax:"#5b9bd5", d:"#3bbf6b" };

function fmtTime(ms){
  const d = new Date(ms);
  const hm = d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  return state.minutes > 1440
    ? d.toLocaleDateString([], {month:"2-digit", day:"2-digit"}) + " " + hm : hm;
}
function ds(label, color, fill){
  return { label, data:[], borderColor:color, backgroundColor:color+"22",
           borderWidth:2, pointRadius:0, tension:0.15, fill:!!fill };
}
function mkChart(id, datasets, ycfg){
  return new Chart(document.getElementById(id), {
    type:"line", data:{datasets},
    options:{ animation:false, responsive:true, maintainAspectRatio:false,
      interaction:{mode:"index", intersect:false},
      plugins:{ legend:{display:datasets.length>1, labels:{color:"#9aa0aa", boxWidth:10, font:{size:11}}},
                tooltip:{callbacks:{title:(it)=>fmtTime(it[0].parsed.x)}} },
      scales:{ x:{type:"linear", grid:{color:"#1d2026"},
                  ticks:{color:"#777", maxTicksLimit:6, callback:(v)=>fmtTime(v)}},
               y:Object.assign({grid:{color:"#1d2026"}, ticks:{color:"#777"}}, ycfg||{}) } }
  });
}
const ch = {
  v:    mkChart("c_v",    [ds("Pack V", C.v, true)], {}),
  a:    mkChart("c_a",    [ds("Current", C.a, true)], {}),
  soc:  mkChart("c_soc",  [ds("SoC", C.soc, true)], {min:0, max:100}),
  t:    mkChart("c_t",    [ds("MOSFET",C.mos), ds("Sensor 1",C.t1), ds("Sensor 2",C.t2)], {}),
  cells:mkChart("c_cells",[ds("Cell min",C.cmin), ds("Cell avg",C.cavg), ds("Cell max",C.cmax)], {}),
  d:    mkChart("c_d",    [ds("Delta mV", C.d, true)], {min:0}),
};

const pts = (t,arr) => t.map((x,i)=>({x, y:arr[i]}));
function setData(chart, idx, t, arr){ chart.data.datasets[idx].data = pts(t,arr); }

// ETA: "13 h 52 m", and the clock time it lands on (weekday if not today)
function fmtDur(h){
  const m = Math.round(h * 60);
  if (m < 60) return `${m}<small> m</small>`;
  if (m < 2880) return `${Math.floor(m/60)}<small> h</small> ${m%60}<small> m</small>`;
  return `${Math.floor(m/1440)}<small> d</small> ${Math.floor(m%1440/60)}<small> h</small>`;
}
function fmtAt(ms){
  const d = new Date(ms), now = new Date();
  const hm = d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  if (d.toDateString() === now.toDateString()) return hm;
  return (ms - now < 6*86400e3 ? d.toLocaleDateString([], {weekday:"short"})
                               : d.toLocaleDateString([], {month:"2-digit", day:"2-digit"})) + " " + hm;
}
function showEta(e){
  const v = document.getElementById("s_eta"), sub = document.getElementById("s_eta_sub");
  const card = document.getElementById("s_eta_card");
  card.style.borderColor = !e ? "" : e.state === "charge" ? "#3bbf6b"
                         : e.state === "discharge" ? "#e0883c" : "";
  if (!e){ v.textContent = "—"; sub.textContent = ""; card.title = ""; return; }
  const a = `${e.amps>=0?"+":""}${e.amps.toFixed(1)} A`;
  card.title = `At the mean current of the last ${Math.round(e.window_s/60)} min: to 0 % SoC `
             + `when discharging, to 100 % when charging (BMS coulomb counter).`;
  if (e.state === "idle"){ v.textContent = "—"; sub.textContent = `idle, ${a}`; return; }
  v.innerHTML = fmtDur(e.hours);
  sub.textContent = `${e.state === "charge" ? "full" : "empty"} at ${fmtAt(e.at)}, ${a}`;
}

// BLE signal as four bars (filled up to the level, coloured by it) and dBm
function signalHtml(link, rssi){
  if (!link) return "no link";
  if (rssi === null || rssi === undefined) return "";   // linked, signal not readable here
  const n = [-90, -80, -70, -60].filter(t => rssi >= t).length;
  const col = n >= 3 ? "#3bbf6b" : n === 2 ? "#e6c84f" : "#d9534f";
  const bars = [..."▂▄▆█"].map((c, i) =>
    `<span style="color:${i < n ? col : "var(--line)"}">${c}</span>`).join("");
  return `${bars} ${rssi} dBm`;
}

// bank buttons (labels from config.py) and the connect / disconnect of the selected one
function showBanks(list, bank){
  const el = document.getElementById("banks");
  if (el.dataset.ids !== list.map(b => b.id).join()){
    el.innerHTML = "";
    list.forEach(b => {
      const btn = document.createElement("button");
      btn.textContent = b.label; btn.dataset.id = b.id;
      btn.onclick = () => { state.bank = b.id; load(); };
      el.appendChild(btn);
    });
    el.dataset.ids = list.map(b => b.id).join();
  }
  [...el.children].forEach(x => x.classList.toggle("on", x.dataset.id === bank));
  state.me = list.find(b => b.id === bank);
  const link = document.getElementById("link");
  link.textContent = state.me.paused ? "Connect" : "Disconnect";
  link.classList.toggle("accent", state.me.paused);   // Connect stands out when paused
  document.querySelector("main").classList.toggle("paused", state.me.paused);
  document.getElementById("sig").innerHTML = state.me.paused ? "" : signalHtml(state.me.link, state.me.rssi);
}
document.getElementById("link").onclick = async () => {
  if (!state.me) return;
  await fetch(`/api/pause?bank=${state.me.id}&on=${state.me.paused ? 0 : 1}`, {method:"POST"});
  load();
};

function colorSoc(s){ return s<20?"#d9534f":s<40?"#e0883c":s<60?"#e6c84f":"#3bbf6b"; }
function colorV(v){ return v<12?"#d9534f":v<12.8?"#e0883c":"#3bbf6b"; }

async function load(){
  let d;
  try { d = await (await fetch(`/api/data?minutes=${state.minutes}&bank=${state.bank}`,
                               {cache:"no-store"})).json(); }
  catch(e){ document.getElementById("age").textContent = "fetch error"; return; }
  state.bank = d.bank;
  showBanks(d.banks, d.bank);

  const L = d.latest;
  const dot = document.getElementById("dot"), age = document.getElementById("age");
  dot.classList.toggle("paused", state.me.paused);
  if (L){
    dot.classList.toggle("stale", !state.me.paused && L.age_s > 120);
    age.textContent = state.me.paused ? "paused, link free"
                    : L.age_s < 90 ? `updated ${Math.round(L.age_s)}s ago`
                                   : `stale ${Math.round(L.age_s)}s`;
    const soc = L.soc_pct;
    const se = document.getElementById("s_soc");
    se.innerHTML = `${soc}<small> %</small>`; se.style.color = colorSoc(soc);
    const bar = document.getElementById("s_soc_bar");
    bar.style.width = soc + "%"; bar.style.background = colorSoc(soc);
    const sv = document.getElementById("s_v");
    sv.innerHTML = `${L.pack_v.toFixed(2)}<small> V</small>`; sv.style.color = colorV(L.pack_v);
    document.getElementById("s_a").innerHTML = `${L.current_a>=0?"+":""}${L.current_a.toFixed(1)}<small> A</small>`;
    document.getElementById("s_w").innerHTML = `${L.power_w>=0?"+":""}${Math.round(L.power_w)}<small> W</small>`;
    showEta(L.eta);
    const cn = document.getElementById("cells_now");
    if (L.cells && L.cells.length){
      const mn = Math.min(...L.cells), mx = Math.max(...L.cells), spread = L.cells.length > 1;
      cn.innerHTML = L.cells.map((v,i) => {
        const col = spread && v===mn ? C.cmin : (spread && v===mx ? C.cmax : "var(--txt)");
        return `<div class="cell"><span class="ci">C${i+1}</span>`
             + `<span class="cv" style="color:${col}">${v.toFixed(3)}<small> V</small></span></div>`;
      }).join("");
    }
  } else {                     // no readings for this bank: don't show the last bank's
    age.textContent = state.me.paused ? "paused, link free" : "no data";
    ["s_soc", "s_v", "s_a", "s_w"].forEach(id => {
      const el = document.getElementById(id); el.textContent = "—"; el.style.color = ""; });
    document.getElementById("s_soc_bar").style.width = "0";
    document.getElementById("cells_now").innerHTML = "";
    showEta(null);
  }

  const t = d.t;
  setData(ch.v, 0, t, d.pack_v);
  setData(ch.a, 0, t, d.current_a);
  setData(ch.soc, 0, t, d.soc_pct);
  setData(ch.t, 0, t, d.mos_temp_c); setData(ch.t, 1, t, d.temp1_c); setData(ch.t, 2, t, d.temp2_c);
  setData(ch.cells, 0, t, d.cell_min_v); setData(ch.cells, 1, t, d.cell_avg_v); setData(ch.cells, 2, t, d.cell_max_v);
  setData(ch.d, 0, t, d.delta_mv);
  // Pin the X axis to the data extent. Otherwise the linear scale rounds the
  // ms bounds to "nice" numbers and over-extends, leaving empty margins L/R.
  const xmin = t.length ? t[0] : undefined, xmax = t.length ? t[t.length - 1] : undefined;
  Object.values(ch).forEach(c => {
    c.options.scales.x.min = xmin;
    c.options.scales.x.max = xmax;
    c.update("none");
  });
}

function schedule(){
  if (state.timer) clearInterval(state.timer);
  if (state.refreshMs > 0) state.timer = setInterval(load, state.refreshMs);
}
load(); schedule();
</script>
</body>
</html>
